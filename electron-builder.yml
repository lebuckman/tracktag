appId: com.tracktag.app
productName: TrackTag
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!resources/bin/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# yt-dlp + ffmpeg ship outside the asar; src/main/lib/binaries.ts resolves
# them at process.resourcesPath/bin when packaged.
extraResources:
  - from: resources/bin
    to: bin
# Ad-hoc signed (identity '-'): no Apple Developer cert, but the bundle is
# properly sealed. Skipping signing entirely (identity: null) makes
# quarantined downloads fail with "damaged and can't be opened" on Apple
# Silicon instead of the recoverable Open Anyway prompt.
mac:
  identity: '-'
  notarize: false
  target:
    - dmg
  category: public.app-category.music
# Stable artifact name so the README's releases/latest/download link
# always resolves; the version lives in the release tag.
dmg:
  artifactName: ${productName}.${ext}
npmRebuild: false
