appId: com.tracktag.app
productName: TrackTag
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!resources/bin/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# yt-dlp + ffmpeg ship outside the asar; src/main/lib/binaries.ts resolves
# them at process.resourcesPath/bin when packaged.
extraResources:
  - from: resources/bin
    to: bin
# v1 ships unsigned — friends right-click → Open past Gatekeeper once.
# Switch to a real identity + notarization if this outgrows that.
mac:
  identity: null
  notarize: false
  target:
    - dmg
  category: public.app-category.music
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
